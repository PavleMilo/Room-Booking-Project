<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Book a study-room</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="book.html">Book a room</a>
            <a href="bookings.html">Bookings</a>
            <a href="contacts.html">Contacts</a>
        </nav>
    </header>
    <main>
        <article class="book-form-group">
            <h2>Book a room here:</h2>
            <label for="Name">Full Name:</label>
            <input required name="Name" type="text" placeholder="Full name here..." id="Name">
            <label for="Epost">Email:</label>
            <input required name="Epost" type="email" placeholder="...@gmail.com" id="Epost">
        </article>
        <section class="book-form-group">
            <h2>Choose a room</h2>
            <select id="roomSelect">
                <option value="Room2B">Room 2B</option>
                <option value="Room5R">Room 5R</option>
                <option value="Room10F">Room 10F</option>
            </select>

            <label for="date">Select a date and time</label>
            <input name="date" type="datetime-local" id="date">

            <label for="TimeDone">Select what time your done</label>
            <input name="TimeDone" type="time" id="TimeDone">
        </section>
        <section class="book-form-group">
            <label for="Purpose">What is your purpose</label>
            <textarea name="Purpose" rows="5" cols="30" id="Purpose"></textarea>
            <label for="People">Amount of people:</label>
            <input name="People" type="number" min="1" max="5" id="People">
            <br>
            <label for="checkbox">Accept the user agreement</label>
            <input name="checkbox" type="checkbox" id="checkbox">
            <br>
            <input type="submit" value="Book Room">
        </section>
    </main>
    <footer>
        <h3>Kontaktinformation:</h3>
        <section class="contact-info">
            <p class="contact-item">Instagram: ononfoans</p>
            <p class="contact-item">Facebook: aonngoa</p>
            <p class="contact-item">E-post: onfoan@gmail.com</p>
            <p class="contact-item">Telefonummer: +46 039 991</p>
        </section>
    </footer>
    
</body>

</html>
